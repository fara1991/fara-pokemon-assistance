name: Deploy to Cloudflare Workers

# https://pokemon.fara-labs.com/ への公開。master に push（PR のマージ含む）されるたびに実行。
# 手動で再実行したいときは Actions タブから Run workflow。
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pokemon.fara-labs.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # サイトはカスタムドメインのルートで公開するので、<base href="/" /> はそのまま。
      # 直接開いた URL（/speed など）は wrangler.jsonc の not_found_handling で index.html を返す。
      - name: Publish Blazor WebAssembly
        run: dotnet publish src/FaraPokemonAssistance.Web --configuration Release --output publish

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
