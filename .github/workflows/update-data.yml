name: Update Pokémon data

# データの更新は develop に commit する（master へは develop からのマージでのみ反映する運用のため）。
# 本番（master）へは通常の develop → master の PR で届く。
# 注意: schedule は常に既定ブランチ（master）のこのファイルで動くので、ここの変更は develop → master のマージ後に schedule へ反映される。

on:
  schedule:
    # 毎週月曜 03:17 UTC（12:17 JST）。HOME のシーズン集計は月初めに切り替わるが週次で十分追従できる。
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      skip_home:
        description: "Pokémon HOME の使用率取得をスキップする"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # 公開ワークフロー（deploy.yml）の起動に使う

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # どのブランチから起動しても（schedule は master で起動する）develop を取得して develop に push する
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync data from PokeAPI and Pokémon HOME
        env:
          SKIP_HOME: ${{ inputs.skip_home }}
        run: |
          if [ "$SKIP_HOME" = "true" ]; then
            python tools/sync_data.py --skip-home
          else
            python tools/sync_data.py
          fi

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FaraPokemonBattleAssistant.Web/wwwroot/api/game
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: weekly sync from PokeAPI / Pokémon HOME ($(date -u +%Y-%m-%d))"
          git push origin HEAD:develop
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN での push では他のワークフローが起動しないため、確認用サイトへの公開は明示的に起動する。
      # 変更が無かったときは上の「Commit changes」で何もしていないので、公開もしない。
      # 本番（deploy.yml）へは develop → master の PR のマージで公開される。
      - name: Deploy updated data (develop)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-develop.yml --ref develop
