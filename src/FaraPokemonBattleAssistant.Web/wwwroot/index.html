<!DOCTYPE html>
<html lang="ja" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Battle Assistant</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="FaraPokemonBattleAssistant.Web.styles.css" rel="stylesheet" />
    <script>
        // 読み込み中の画面でもテーマを合わせる（保存済みの設定を先に反映する）
        try {
            // 名前を変える前のキー（fara-pokemon-assistance.*）の設定・登録ポケモンは引き継がずに削除する
            localStorage.removeItem("fara-pokemon-assistance.settings");
            localStorage.removeItem("fara-pokemon-assistance.roster");
            var s = JSON.parse(localStorage.getItem("fara-pokemon-battle-assistant.settings") || "{}");
            if (s.Theme === "dark") document.documentElement.setAttribute("data-bs-theme", "dark");
        } catch (e) { }
    </script>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner-border text-primary" role="status"></div>
            <p>読み込み中...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。ページを再読み込みしてください。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // 検索付きセレクトで、選択中の候補が見えるところまでスクロールする
        window.faraFocus = function (id) { var el = document.getElementById(id); if (el) el.focus({ preventScroll: true }); };
        window.faraScrollIntoView = function (id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ block: "nearest" }); };
        // PC では、一覧・カードの中だけがスクロールする（app.css の .pane-scroll など）。
        // スクロール枠の中にある候補リスト・ヘルプの吹き出しが枠で切れないよう、画面基準（position: fixed）で置く。
        // 狭い画面（スマホ。ページ全体がスクロールする）では何もしない
        (function () {
            var wide = window.matchMedia("(min-width: 768px)");
            var tracked = [];
            function refresh() { tracked = tracked.filter(function (t) { return t.el.isConnected && (t.place(), true); }); }
            ["scroll", "resize"].forEach(function (type) { window.addEventListener(type, function () { if (tracked.length) refresh(); }, true); });
            function track(el, place) {
                if (!tracked.some(function (t) { return t.el === el; })) tracked.push({ el: el, place: place });
                place();
            }
            // 検索付きセレクトの候補リスト: 入力欄の真下（下に余裕がなければ真上）に、入る高さで出す
            window.faraPlaceDropdown = function (id) {
                var el = document.getElementById(id);
                if (!el || !wide.matches) return;
                var anchor = el.parentElement;
                track(el, function () {
                    var r = anchor.getBoundingClientRect(), vh = window.innerHeight;
                    var below = vh - r.bottom - 6, above = r.top - 6;
                    var up = below < 180 && above > below;
                    el.classList.add("is-floating");
                    el.classList.toggle("is-up", up);
                    el.style.left = r.left + "px";
                    el.style.width = r.width + "px";
                    el.style.maxHeight = Math.max(120, Math.min(320, up ? above : below)) + "px";
                    el.style.top = up ? "auto" : r.bottom + "px";
                    el.style.bottom = up ? (vh - r.top) + "px" : "auto";
                });
            };
            // ヘルプの吹き出し: ? ボタンの右（入らなければ左）に、画面からはみ出さないように出す
            // 背景のバトルフィールド：ポケモンの画像を、画面に描かれた足場の真ん中に足元を合わせて置く。
            // 大きさは足場の幅に比例させるので、奥の足場のポケモンは遠近で小さくなる
            window.faraPlaceStage = function () {
                [["foe", "field-pad-foe"], ["mine", "field-pad-mine"]].forEach(function (p) {
                    var pad = document.querySelector("." + p[1]), img = document.querySelector(".field-mon-" + p[0]);
                    if (!pad || !img) return;
                    var r = pad.getBoundingClientRect(), w = r.width * 1.3;
                    // フィールドが回って手前に来た足場のポケモンほど、前に重ねる
                    img.style.zIndex = String(Math.round(r.top + r.height / 2));
                    img.style.width = w + "px";
                    img.style.left = (r.left + r.width / 2 - w / 2) + "px";
                    img.style.top = (r.top + r.height / 2 - w * 0.92) + "px";
                    img.style.visibility = "visible";
                });
            };
            window.addEventListener("resize", function () { window.faraPlaceStage(); });
            // フィールドは回り続けるので、毎フレーム合わせ直す（視差効果を減らす設定では回らないので、描き直しと画面の大きさが変わったときだけ）
            if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                (function follow() { window.faraPlaceStage(); requestAnimationFrame(follow); })();
            }

            window.faraPlaceNote = function (id) {
                var el = document.getElementById(id);
                if (!el || !wide.matches || el.closest(".sidebar")) return;
                var btn = el.parentElement.querySelector(".help-btn");
                track(el, function () {
                    var r = btn.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
                    var w = Math.min(288, vw - 16);
                    el.classList.add("is-floating");
                    el.style.width = w + "px";
                    var left = r.right + 8, nudged = false;
                    if (left + w > vw - 8) { left = r.left - 8 - w; nudged = true; }
                    if (left < 8) { left = Math.max(8, vw - w - 8); nudged = true; }
                    var top = Math.max(8, Math.min(r.top - 6, vh - el.offsetHeight - 8));
                    el.classList.toggle("is-nudged", nudged || top !== r.top - 6);
                    el.style.left = left + "px";
                    el.style.top = top + "px";
                });
            };
        })();
        // 検索付きセレクトの ↑↓・Enter で、ページのスクロールなどを起こさない。
        // Blazor の @onkeydown:preventDefault は前回の描画時の値で決まり、次のキーに効いてしまうので、ここで止める
        document.addEventListener("keydown", function (e) {
            if ((e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Enter") && e.target.closest && e.target.closest(".searchable-select")) e.preventDefault();
        }, true);
        // 無効にした項目（aria-disabled="true"。未対応の世代のメニューなど）は、クリック・中クリック・タップ・Enter で何も起こさない
        ["click", "auxclick", "mousedown", "mouseup", "keydown"].forEach(function (type) {
            document.addEventListener(type, function (e) {
                if (type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
                if (type.indexOf("mouse") === 0 && e.button !== 1) return; // 中クリックの自動スクロール・新しいタブを止める
                var el = e.target.closest && e.target.closest('[aria-disabled="true"]');
                if (!el) return;
                e.preventDefault();
                e.stopPropagation();
            }, true);
        });
    </script>
    <script src="js/motion.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
