<!DOCTYPE html>
<html lang="ja" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポケモン対戦アシスタント</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="FaraPokemonAssistance.Web.styles.css" rel="stylesheet" />
    <script>
        // 読み込み中の画面でもテーマを合わせる（保存済みの設定を先に反映する）
        try {
            var s = JSON.parse(localStorage.getItem("fara-pokemon-assistance.settings") || "{}");
            if (s.Theme === "dark") document.documentElement.setAttribute("data-bs-theme", "dark");
        } catch (e) { }
    </script>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner-border text-primary" role="status"></div>
            <p>読み込み中...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。ページを再読み込みしてください。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // 検索付きセレクトで、選択中の候補が見えるところまでスクロールする
        window.faraScrollIntoView = function (id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ block: "nearest" }); };
        // 検索付きセレクトの ↑↓・Enter で、ページのスクロールなどを起こさない。
        // Blazor の @onkeydown:preventDefault は前回の描画時の値で決まり、次のキーに効いてしまうので、ここで止める
        document.addEventListener("keydown", function (e) {
            if ((e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Enter") && e.target.closest && e.target.closest(".searchable-select")) e.preventDefault();
        }, true);
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
